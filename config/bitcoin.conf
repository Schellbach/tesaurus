# Bitcoin Core Configuration - Optimized for Tesaurus Vault

# Network
testnet=1
server=1
listen=1
maxconnections=50

# RPC
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcuser=testuser
rpcpassword=testpass
rpcthreads=4
rpcworkqueue=64

# Performance optimizations
dbcache=1024
maxmempool=300
mempoolexpiry=72

# Transaction indexing
txindex=1
addresstype=bech32
changetype=bech32

# ZeroMQ for real-time notifications
zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333
zmqpubhashtx=tcp://0.0.0.0:28334
zmqpubhashblock=tcp://0.0.0.0:28335

# Wallet settings
disablewallet=0
keypool=1000
walletnotify=/usr/local/bin/wallet-notify.sh %s

# Security
whitelist=172.20.0.0/16
rpcauth=testuser:7d9ba5ae63c3d4dc30583ff4fe65a67e$9e3634e81c11659e3de036d0bf88f89cd169c1039e6e09607562d54765c649cc

# Logging
debug=0
printtoconsole=0
shrinkdebugfile=1

# Performance tuning
par=4  # Use 4 threads for script verification
checkblocks=144  # Check last 144 blocks on startup