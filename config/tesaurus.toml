# Tesaurus configuration (testnet defaults)

[bitcoin]
network = "testnet"
rpc_url = "http://127.0.0.1:18332"
wallet_name = "tesaurus"
# Prefer cookie authentication:
# cookie_path = "/absolute/path/to/bitcoin/testnet3/.cookie"
# Or set rpc_user and rpc_password locally. Never commit real credentials.

[vault]
state_path = "./data/vault.json"
keys_dir = "./keys"
# Demo-only relative timelock (CSV) for the recovery path.
csv_blocks = 10
