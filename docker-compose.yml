services:
  bitcoind:
    image: bitcoin/bitcoin:28.0
    container_name: tesaurus-bitcoind
    command:
      - -regtest
      - -server
      - -txindex
      - -fallbackfee=0.0002
      - -rpcuser=tesaurus
      - -rpcpassword=changeme
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -printtoconsole
    ports:
      - "18443:18443"
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=tesaurus", "-rpcpassword=changeme", "getblockchaininfo"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  bitcoind-data:
