name: Security CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show pinned toolchain
        run: rustc --version && cargo --version
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --locked --workspace
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Verify fail-closed entry points
        shell: bash
        run: |
          set -euo pipefail
          if output="$(cargo run --quiet --bin tesaurus-agent -- 2>&1)"; then
            echo "tesaurus-agent unexpectedly started"
            exit 1
          fi
          case "$output" in
            *"PSBT-only"*) ;;
            *) echo "tesaurus-agent did not report PSBT containment"; exit 1 ;;
          esac
          if cargo run --quiet --bin tesaurus -- init-config \
            --network mainnet --path /tmp/tesaurus-mainnet.toml; then
            echo "mainnet configuration unexpectedly succeeded"
            exit 1
          fi
          test ! -e /tmp/tesaurus-mainnet.toml
          if cargo run --quiet --bin tesaurus -- spend \
            --to invalid --amount-sats 1 --via-agent; then
            echo "--via-agent unexpectedly succeeded"
            exit 1
          fi
          if grep -R -n -E 'primary\.wif|override\.wif' tesaurus-agent tesaurus-policy; then
            echo "policy/agent crates must not mention coordinator WIF filenames"
            exit 1
          fi
          if grep -E '^\s*tesaurus\s*=' tesaurus-agent/Cargo.toml; then
            echo "tesaurus-agent must not depend on the tesaurus WIF-loading crate"
            exit 1
          fi
          # from_agent_tcb is a dumb public assembler; callers are TCB until
          # this call-site lock exists. Not a type-system seal.
          view_hits="$(grep -R -n --include='*.rs' -E 'from_agent_tcb([^_A-Za-z0-9]|$)' \
            tesaurus-policy tesaurus-agent || true)"
          if [ -z "$view_hits" ]; then
            echo "from_agent_tcb must be defined in tesaurus-policy/src/facts.rs"
            exit 1
          fi
          view_bad="$(printf '%s\n' "$view_hits" \
            | grep -vE 'tesaurus-policy/src/facts.rs:|tesaurus-agent/src/chain.rs:' || true)"
          if [ -n "$view_bad" ]; then
            echo "from_agent_tcb must be defined only in tesaurus-policy/src/facts.rs and called only from tesaurus-agent/src/chain.rs"
            echo "$view_bad"
            exit 1
          fi
          echo "$view_hits" | grep -q 'tesaurus-policy/src/facts.rs:'
          echo "$view_hits" | grep -q 'tesaurus-agent/src/chain.rs:'
          auth_hits="$(grep -R -n --include='*.rs' -F 'from_agent_tcb_mac_unspecified' \
            tesaurus-policy tesaurus-agent || true)"
          if [ -z "$auth_hits" ]; then
            echo "from_agent_tcb_mac_unspecified must be defined in tesaurus-policy/src/facts.rs"
            exit 1
          fi
          auth_bad="$(printf '%s\n' "$auth_hits" \
            | grep -vE 'tesaurus-policy/src/facts.rs:|tesaurus-agent/src/auth.rs:' || true)"
          if [ -n "$auth_bad" ]; then
            echo "from_agent_tcb_mac_unspecified must be called only from tesaurus-agent/src/auth.rs"
            echo "$auth_bad"
            exit 1
          fi
          echo "$auth_hits" | grep -q 'tesaurus-policy/src/facts.rs:'
          echo "$auth_hits" | grep -q 'tesaurus-agent/src/auth.rs:'
          python3 - <<'PY'
from pathlib import Path
import re
import sys
bad = []
for path in Path(".").rglob("Cargo.toml"):
    if "target" in path.parts:
        continue
    section = None
    for i, line in enumerate(path.read_text().splitlines(), 1):
        m = re.match(r"^\[([^\]]+)\]\s*$", line)
        if m:
            section = m.group(1).strip()
            continue
        if section == "dependencies" and "agent-test-harness" in line:
            bad.append(f"{path}:{i}: {line}")
if bad:
    print("agent-test-harness must not appear under [dependencies] (AUTH bypass)")
    print("\n".join(bad))
    sys.exit(1)
PY
      - name: Build release binaries
        run: cargo build --release --locked --bins

  container:
    name: Container containment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Build research CLI image
        run: docker build --tag tesaurus-containment:ci .
      - name: Verify image surface
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm tesaurus-containment:ci --help
          docker run --rm --entrypoint sh tesaurus-containment:ci \
            -c 'test ! -e /usr/local/bin/tesaurus-agent'
          test "$(docker image inspect \
            --format '{{json .Config.ExposedPorts}}' tesaurus-containment:ci)" = "null"

  regtest:
    name: Bitcoin Core regtest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start isolated Bitcoin Core
        run: docker compose up -d bitcoind
      - name: Build release CLI
        run: cargo build --release --locked --bin tesaurus
      - name: Exercise primary and recovery broadcasts
        shell: bash
        run: |
          set -euo pipefail
          bitcoin_cli() {
            docker compose --file "$GITHUB_WORKSPACE/docker-compose.yml" \
              exec -T bitcoind bitcoin-cli \
              -regtest -rpcuser=tesaurus -rpcpassword=changeme "$@"
          }
          for _ in $(seq 1 30); do
            if bitcoin_cli getblockchaininfo >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          bitcoin_cli getblockchaininfo >/dev/null
          bitcoin_cli createwallet miner >/dev/null
          bitcoin_cli -rpcwallet=miner -generate 101 >/dev/null

          WORK=/tmp/tesaurus-regtest-ci
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp config/tesaurus.regtest.toml "$WORK/tesaurus.toml"
          chmod 600 "$WORK/tesaurus.toml"
          TES="$GITHUB_WORKSPACE/target/release/tesaurus"

          cd "$WORK"
          "$TES" -c tesaurus.toml keys generate >/dev/null
          "$TES" -c tesaurus.toml init-vault >/dev/null
          "$TES" -c tesaurus.toml import-watch >/dev/null
          ADDR="$("$TES" -c tesaurus.toml address | awk 'NR == 1 { print; exit }')"
          DEST="$(bitcoin_cli -rpcwallet=miner getnewaddress)"

          bitcoin_cli -rpcwallet=miner sendtoaddress "$ADDR" 1 >/dev/null
          bitcoin_cli -rpcwallet=miner -generate 1 >/dev/null
          "$TES" -c tesaurus.toml spend --to "$DEST" \
            --amount-sats 100000 --fee-sats 1000 --path primary --broadcast >/dev/null
          bitcoin_cli -rpcwallet=miner -generate 1 >/dev/null

          bitcoin_cli -rpcwallet=miner sendtoaddress "$ADDR" 0.5 >/dev/null
          bitcoin_cli -rpcwallet=miner -generate 10 >/dev/null
          "$TES" -c tesaurus.toml spend --to "$DEST" \
            --amount-sats 50000 --fee-sats 1000 --path recovery --broadcast >/dev/null
      - name: Stop isolated Bitcoin Core
        if: always()
        run: docker compose down --volumes

  dependencies:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: Scan Cargo.lock
        run: cargo audit
