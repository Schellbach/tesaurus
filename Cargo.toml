[package]
name = "tesaurus"
version = "0.2.0"
edition = "2021"
authors = ["Tesaurus contributors"]
description = "Sovereign Bitcoin vault with a local agent recovery co-signer"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Schellbach/tesaurus"
keywords = ["bitcoin", "vault", "miniscript", "multisig", "custody"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]
rust-version = "1.85"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json"] }
base64 = "0.22"
bitcoin = { version = "0.32", features = ["serde", "rand", "std"] }
bitcoincore-rpc = "0.19"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
miniscript = { version = "12", features = ["serde", "compiler"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-util"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tesaurus"
path = "src/bin/tesaurus.rs"

[[bin]]
name = "tesaurus-agent"
path = "src/bin/tesaurus-agent.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
