[workspace]
members = ["tesaurus-policy", "tesaurus-agent"]
default-members = [".", "tesaurus-policy", "tesaurus-agent"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Tesaurus contributors"]
license = "MIT"
repository = "https://github.com/Schellbach/tesaurus"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
bitcoin = { version = "0.32", features = ["serde", "rand", "std"] }
bitcoincore-rpc = "0.19"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
miniscript = { version = "13", features = ["serde", "compiler"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
toml = "1.1"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "tesaurus"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Experimental Bitcoin vault research; network co-signing is disabled"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["bitcoin", "vault", "miniscript", "multisig", "custody"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
bitcoin.workspace = true
bitcoincore-rpc.workspace = true
clap.workspace = true
hex.workspace = true
miniscript.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "tesaurus"
path = "src/bin/tesaurus.rs"

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
