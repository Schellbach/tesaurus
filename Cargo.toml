[package]
name = "tesaurus"
version = "0.2.0"
edition = "2021"
authors = ["Tesaurus contributors"]
description = "Experimental Bitcoin vault research; network co-signing is disabled"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Schellbach/tesaurus"
keywords = ["bitcoin", "vault", "miniscript", "multisig", "custody"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]
rust-version = "1.85"
publish = false

[dependencies]
anyhow = "1"
bitcoin = { version = "0.32", features = ["serde", "rand", "std"] }
bitcoincore-rpc = "0.19"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
miniscript = { version = "12", features = ["serde", "compiler"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tesaurus"
path = "src/bin/tesaurus.rs"

[[bin]]
name = "tesaurus-agent"
path = "src/bin/tesaurus-agent.rs"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
