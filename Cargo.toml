[package]
name = "tesaurus"
version = "0.1.0"
edition = "2021"
authors = ["Tesaurus Team"]
description = "A performance-optimized Bitcoin vault with AI recovery"
license = "MIT"

# Performance optimizations at package level
[profile.release]
# Enable maximum optimizations
opt-level = 3
# Enable link-time optimization for better performance
lto = true
# Reduce binary size while maintaining performance
codegen-units = 1
# Strip symbols to reduce binary size
strip = true
# Enable panic=abort for smaller binaries and better performance
panic = "abort"

[profile.dev]
# Faster compilation during development
opt-level = 1
debug = true

[dependencies]
# Core Bitcoin functionality
bitcoin = { version = "0.31", features = ["serde", "rand"] }
bitcoincore-rpc = "0.18"

# Async runtime for performance
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"

# Serialization with performance focus
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3" # Binary serialization for performance

# Cryptography
secp256k1 = { version = "0.28", features = ["rand", "recovery"] }
sha2 = "0.10"
hmac = "0.12"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging with performance considerations
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.14"
clap = { version = "4.0", features = ["derive"] }

# Database for efficient storage
sled = "0.34" # Embedded database with good performance
rusqlite = { version = "0.30", features = ["bundled"] }

# Network performance
reqwest = { version = "0.11", features = ["json"] }
hyper = { version = "0.14", features = ["full"] }

# Memory optimization
parking_lot = "0.12" # Faster mutex implementation
dashmap = "5.5" # Concurrent HashMap

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Performance monitoring
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.0"

[[bin]]
name = "tesaurus-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "tesaurus-cli"
path = "src/bin/cli.rs"

[[bench]]
name = "performance"
harness = false

[features]
default = ["metrics"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]