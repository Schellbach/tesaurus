[package]
name = "tesaurus-policy"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Pure Tesaurus agent policy: PSBT v0, AgentPin, confirm, CSV/wall-clock, R1 replay, D5 (no key I/O)"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# tesaurus-agent enables this to assemble ChainView / PrevoutFact / AgentAuth
# after Core B RPC. Hidden from this crate's own tests (`not(test)`) even when
# Cargo unifies workspace features. Dumb public assembler: callers are TCB;
# not a type-system seal.
agent-tcb = []
# Dev-only: lets tesaurus-agent tests drive evaluate past AUTH without a MAC.
# Must not appear under [dependencies]; that would bypass AUTH in production.
agent-test-harness = []

[dependencies]
bitcoin.workspace = true
hex.workspace = true
miniscript.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
